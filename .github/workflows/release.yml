name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run budget
      - name: Pack the SDK
        run: npm pack ./packages/sdk --pack-destination dist
      - name: Publish the SDK to npm with provenance
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish ./packages/sdk --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Attach the SDK bundle and SRI hashes to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tgz dist/sdk/*.min.js dist/sdk/sri.json --clobber || true
        env:
          GH_TOKEN: ${{ github.token }}
