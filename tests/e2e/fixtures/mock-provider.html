<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock provider</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      video {
        width: 100%;
        height: 100%;
        display: block;
      }
      #probe {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!-- a full-size link and input: a hostile provider's click and focus traps -->
    <a id="probe" href="https://example.com/ad" target="_blank" rel="opener">ad</a>
    <video id="v" playsinline muted></video>
    <input id="trap" aria-label="trap" style="position: absolute; left: -9999px" />
    <script>
      // Test-only provider speaking the PlayerJS-style protocol EmbedMaster documents (docs/SOURCES.md).
      const q = new URLSearchParams(location.search);
      const mode = q.get("mode") || "ok";
      const themed = q.get("controls") === "1";
      const v = document.getElementById("v");
      window.__attempts = [];
      const send = (event, info) => !window.__stalled && parent.postMessage({ source: "mock_player", event, info }, "*");
      if (themed) {
        v.controls = true;
        document.getElementById("probe").remove();
        if (/^[0-9a-f]{6}$/i.test(q.get("color") || "")) document.body.style.background = "#" + q.get("color");
      }
      v.src = "http://localhost:4173/media/test/clip-360p.mp4";
      v.preload = "auto";
      if (mode === "fail") setTimeout(() => send("loaderror", "mock source failed"), 300);
      else if (mode !== "silent") {
        v.addEventListener("loadedmetadata", () => {
          send("init");
          send("duration", v.duration);
        });
        v.addEventListener("play", () => send("play"));
        v.addEventListener("pause", () => send("pause"));
        v.addEventListener("waiting", () => send("buffering"));
        v.addEventListener("playing", () => send("buffered"));
        v.addEventListener("ended", () => send("end"));
        v.addEventListener("volumechange", () => {
          send(v.muted ? "mute" : "unmute");
          send("volume", v.volume);
        });
        // stall: after 2 s the provider freezes silently (no pause, no time, no reply), like a dead stream
        v.addEventListener("timeupdate", () => {
          if (mode === "stall" && v.currentTime > 2) {
            window.__stalled = true;
            v.pause();
            return;
          }
          send("time", v.currentTime);
        });
        v.play().catch(() => {});
      }
      if (!themed)
        addEventListener("message", (e) => {
          const d = e.data;
          if (!d || d.source !== "mock_player_command" || stalledCommands()) return;
          if (d.command === "play") v.play().catch(() => send("error", "play blocked"));
          else if (d.command === "pause") v.pause();
          else if (d.command === "seek") v.currentTime = Number(d.value) || 0;
          else if (d.command === "volume") v.volume = Math.min(1, Math.max(0, Number(d.value) / 100));
          else if (d.command === "mute") v.muted = true;
          else if (d.command === "unmute") v.muted = false;
          else if (d.command === "speed") v.playbackRate = Number(d.value) || 1;
        });
      function stalledCommands() {
        return !!window.__stalled;
      }

      if (mode === "hostile") {
        const note = (what, ok) => window.__attempts.push(what + ":" + (ok ? "ok" : "blocked"));
        const attack = (why) => {
          try {
            note(why + "-open", !!window.open("https://example.com/popup", "_blank"));
          } catch {
            note(why + "-open", false);
          }
          try {
            top.location.href = "https://example.com/redirect";
            note(why + "-top", true);
          } catch {
            note(why + "-top", false);
          }
          try {
            parent.location.href = "https://example.com/parent";
            note(why + "-parent", true);
          } catch {
            note(why + "-parent", false);
          }
          try {
            document.getElementById("probe").click();
            note(why + "-link", true);
          } catch {
            note(why + "-link", false);
          }
          try {
            document.getElementById("trap").focus();
            window.focus();
            note(why + "-focus", document.hasFocus());
          } catch {
            note(why + "-focus", false);
          }
          // modals on load and on any user gesture (a timer would only stall the test harness)
          if (why !== "timer")
            try {
              note(why + "-alert", (alert("modal:" + why), true));
            } catch {
              note(why + "-alert", false);
            }
          if (why.startsWith("user"))
            try {
              location.href = "intent://scan/#Intent;scheme=zxing;end";
            } catch {}
        };
        setTimeout(() => attack("load"), 500);
        setInterval(() => attack("timer"), 1500);
        // Only real user input counts as a gesture; the provider's own synthetic clicks do not.
        for (const type of ["click", "pointerdown", "keydown", "touchstart"])
          addEventListener(
            type,
            (e) => {
              if (e.isTrusted) {
                window.__gestures = (window.__gestures || 0) + 1;
                attack("user-" + type);
              }
            },
            true
          );
      }
    </script>
  </body>
</html>
